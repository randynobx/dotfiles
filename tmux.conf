################################################################################
## .tmux.conf - tmux configuration (tmux >= 3.2)
################################################################################

### Keys ###

# split panes using | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# reload config file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# switch panes using Alt-vim keys without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# switch windows using Alt-Shift vim keys
bind -n M-H select-window -p
bind -n M-L select-window -n

### Behaviour ###

set -g mouse on
set -g allow-rename off

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity off

### Design ###

# modes / clock
setw -g mode-style "fg=colour196,bg=colour238,bold"
setw -g clock-mode-colour colour135

# panes
set -g pane-border-style "fg=colour238,bg=colour235"
set -g pane-active-border-style "fg=colour51,bg=colour236"

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style "fg=colour137,bg=colour234,dim"
set -g status-left '[#S]'
set -g status-left-length 20
set -g status-right '#[fg=colour233,bg=colour241,bold] %Y-%m-%d #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# window list
setw -g window-status-style "fg=colour138,bg=colour235,none"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-current-style "fg=colour81,bg=colour238,bold"
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-bell-style "fg=colour255,bg=colour1,bold"

# messages
set -g message-style "fg=colour232,bg=colour166,bold"
set -g message-command-style "fg=blue,bg=black"
