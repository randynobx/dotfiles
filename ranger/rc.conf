# ranger rc.conf - personal overrides only (ranger >= 1.9.4)
#
# ranger loads its bundled defaults first, then this file, so only settings
# that differ from upstream belong here. Reference for every option/keybinding:
#   https://github.com/ranger/ranger/blob/master/ranger/config/rc.conf
#   or `ranger --copy-config=rc` to dump the current defaults for comparison.
#
# rifle.conf and scope.sh are intentionally absent: ranger falls back to its
# bundled (and maintained) copies. Add them here only if you customise them.

# ===================================================================
# == Options
# ===================================================================

# show git status in the file list and statusbar
set vcs_aware true

set colorscheme zenburn

# show directory names in tabs instead of numbers
set dirname_in_tabs true

# set the terminal/window title to the current directory
set update_title true

# skip previews for files over 20 MB (big/scanned PDFs, files on the NAS or
# in iCloud can stall ranger while the preview is generated); 0 = no limit
set preview_max_size 20000000

# ===================================================================
# == Keybindings
# ===================================================================

# fuzzy-find a file or directory (commands.py: fzf_select)
# Ctrl+t matches fzf's own file-finder binding in the shell (fzf --zsh)
map <C-t> fzf_select

# open the selected file in vim in a new tmux pane to the right
map ef shell [ -n "$TMUX" ] && tmux split-window -h "vim %f"
